<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" role="img" aria-labelledby="t">
  <title id="t">Obrigada por passar por aqui</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14070b"/>
      <stop offset="1" stop-color="#2a0b16"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a1022"/>
      <stop offset="0.5" stop-color="#c41e3a"/>
      <stop offset="1" stop-color="#5a1022"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a257" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#d9a257" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d9a257" stop-opacity="0.15"/>
    </linearGradient>
