    .msg { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size: 26px; font-weight: 200; letter-spacing: 2px; fill: #f6e9e2; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="160" fill="url(#bg)"/>
    <g class="wb" opacity="0.9">
      <path d="M0 96 Q125 66 250 96 T500 96 T750 96 T1000 96 T1250 96 T1500 96 T1750 96 T2000 96 V160 H0 Z" fill="url(#w2)"/>
    </g>
    <g class="wa">
