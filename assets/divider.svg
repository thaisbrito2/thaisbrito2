<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c41e3a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c41e3a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d9a257" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6e9e2"/>
      <stop offset="0.35" stop-color="#d9a257" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d9a257" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .dot { animation: run 6s ease-in-out infinite alternate; }
    @keyframes run { from { transform: translateX(120px); } to { transform: translateX(880px); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; transform: translateX(500px); } }
  </style>
  <rect x="0" y="11" width="1000" height="2" fill="url(#line)"/>
  <g class="dot"><circle cx="0" cy="12" r="11" fill="url(#spark)"/></g>
</svg>
